<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/css/03-css.css">

    <title>28-challenge</title>
    <style>
        figure.frame {
            background: #fff;
            height: calc(50 * 20px);
            width: calc(35 * 20px);
            margin: 2rem auto;
            zoom: 0.60;
            position: relative;
        }

        div.squares {
            background: url("/src/imgs/square.png");
            opacity: 0.2;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        div.saitama {
            background-color: transparent;
            height: 16px;
            width: 16px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            /* ESCALA para agrandar el perro dentro del square */
            transform: scale(3);
            transform-origin: top left;
            box-shadow:
                /* FILA 1 - orejas */
                48px 32px 0 0 #6b3a1f, 64px 32px 0 0 #6b3a1f, 128px 32px 0 0 #6b3a1f, 144px 32px 0 0 #6b3a1f,
                /* FILA 2 */
                32px 48px 0 0 #6b3a1f, 48px 48px 0 0 #8B5A2B, 64px 48px 0 0 #8B5A2B, 80px 48px 0 0 #000,
                112px 48px 0 0 #000, 128px 48px 0 0 #8B5A2B, 144px 48px 0 0 #8B5A2B, 160px 48px 0 0 #6b3a1f,
                /* FILA 3 - frente */
                32px 64px 0 0 #6b3a1f, 48px 64px 0 0 #8B5A2B, 64px 64px 0 0 #c8884d, 80px 64px 0 0 #c8884d,
                96px 64px 0 0 #c8884d, 112px 64px 0 0 #c8884d, 128px 64px 0 0 #c8884d, 144px 64px 0 0 #8B5A2B,
                160px 64px 0 0 #6b3a1f,
                /* FILA 4 */
                32px 80px 0 0 #6b3a1f, 48px 80px 0 0 #8B5A2B, 64px 80px 0 0 #c8884d, 80px 80px 0 0 #c8884d,
                96px 80px 0 0 #c8884d, 112px 80px 0 0 #c8884d, 128px 80px 0 0 #c8884d, 144px 80px 0 0 #8B5A2B,
                160px 80px 0 0 #6b3a1f,
                /* FILA 5 - ojos */
                32px 96px 0 0 #6b3a1f, 48px 96px 0 0 #8B5A2B, 64px 96px 0 0 #c8884d, 80px 96px 0 0 #1a0a00,
                96px 96px 0 0 #c8884d, 112px 96px 0 0 #1a0a00, 128px 96px 0 0 #c8884d, 144px 96px 0 0 #8B5A2B,
                160px 96px 0 0 #6b3a1f,
                /* FILA 6 - brillo ojos */
                32px 112px 0 0 #6b3a1f, 48px 112px 0 0 #8B5A2B, 64px 112px 0 0 #c8884d, 80px 112px 0 0 #1a0a00,
                88px 112px 0 0 #fff, 96px 112px 0 0 #c8884d, 112px 112px 0 0 #1a0a00, 120px 112px 0 0 #fff,
                128px 112px 0 0 #c8884d, 144px 112px 0 0 #8B5A2B, 160px 112px 0 0 #6b3a1f,
                /* FILA 7 - nariz */
                32px 128px 0 0 #6b3a1f, 48px 128px 0 0 #8B5A2B, 64px 128px 0 0 #c8884d, 80px 128px 0 0 #c8884d,
                96px 128px 0 0 #2d1a0a, 112px 128px 0 0 #c8884d, 128px 128px 0 0 #c8884d, 144px 128px 0 0 #8B5A2B,
                160px 128px 0 0 #6b3a1f,
                /* FILA 8 - hocico */
                48px 144px 0 0 #6b3a1f, 64px 144px 0 0 #c8884d, 80px 144px 0 0 #e8b080,
                96px 144px 0 0 #e8b080, 112px 144px 0 0 #e8b080, 128px 144px 0 0 #c8884d, 144px 144px 0 0 #6b3a1f,
                /* FILA 9 - boca */
                48px 160px 0 0 #6b3a1f, 64px 160px 0 0 #8B5A2B, 80px 160px 0 0 #2d1a0a,
                96px 160px 0 0 #e8534a, 112px 160px 0 0 #2d1a0a, 128px 160px 0 0 #8B5A2B, 144px 160px 0 0 #6b3a1f,
                /* FILA 10 - cuello */
                64px 176px 0 0 #6b3a1f, 80px 176px 0 0 #8B5A2B, 96px 176px 0 0 #8B5A2B,
                112px 176px 0 0 #8B5A2B, 128px 176px 0 0 #6b3a1f,
                /* FILA 11 - cuerpo */
                48px 192px 0 0 #6b3a1f, 64px 192px 0 0 #8B5A2B, 80px 192px 0 0 #c8884d,
                96px 192px 0 0 #c8884d, 112px 192px 0 0 #c8884d, 128px 192px 0 0 #8B5A2B, 144px 192px 0 0 #6b3a1f,
                /* FILA 12 */
                32px 208px 0 0 #6b3a1f, 48px 208px 0 0 #8B5A2B, 64px 208px 0 0 #c8884d,
                80px 208px 0 0 #c8884d, 96px 208px 0 0 #c8884d, 112px 208px 0 0 #c8884d, 128px 208px 0 0 #c8884d,
                144px 208px 0 0 #8B5A2B, 160px 208px 0 0 #6b3a1f,
                /* FILA 13 */
                32px 224px 0 0 #6b3a1f, 48px 224px 0 0 #8B5A2B, 64px 224px 0 0 #c8884d,
                80px 224px 0 0 #c8884d, 96px 224px 0 0 #c8884d, 112px 224px 0 0 #c8884d, 128px 224px 0 0 #c8884d,
                144px 224px 0 0 #8B5A2B, 160px 224px 0 0 #6b3a1f,
                /* FILA 14 - patas delanteras */
                32px 240px 0 0 #6b3a1f, 48px 240px 0 0 #8B5A2B, 64px 240px 0 0 #c8884d,
                80px 240px 0 0 #c8884d, 96px 240px 0 0 #c8884d, 112px 240px 0 0 #c8884d, 128px 240px 0 0 #c8884d,
                144px 240px 0 0 #8B5A2B, 160px 240px 0 0 #6b3a1f,
                /* FILA 15 */
                32px 256px 0 0 #6b3a1f, 48px 256px 0 0 #8B5A2B, 64px 256px 0 0 #c8884d,
                80px 256px 0 0 #c8884d, 112px 256px 0 0 #c8884d, 128px 256px 0 0 #c8884d,
                144px 256px 0 0 #8B5A2B, 160px 256px 0 0 #6b3a1f,
                /* FILA 16 */
                32px 272px 0 0 #6b3a1f, 48px 272px 0 0 #8B5A2B, 64px 272px 0 0 #c8884d,
                128px 272px 0 0 #c8884d, 144px 272px 0 0 #8B5A2B, 160px 272px 0 0 #6b3a1f,
                /* FILA 17 */
                32px 288px 0 0 #6b3a1f, 48px 288px 0 0 #8B5A2B, 64px 288px 0 0 #8B5A2B,
                128px 288px 0 0 #8B5A2B, 144px 288px 0 0 #8B5A2B, 160px 288px 0 0 #6b3a1f,
                /* FILA 18 - suelo */
                32px 304px 0 0 #6b3a1f, 48px 304px 0 0 #6b3a1f, 64px 304px 0 0 #6b3a1f,
                128px 304px 0 0 #6b3a1f, 144px 304px 0 0 #6b3a1f, 160px 304px 0 0 #6b3a1f,
                /* COLA */
                176px 192px 0 0 #6b3a1f, 192px 176px 0 0 #8B5A2B, 208px 160px 0 0 #8B5A2B,
                208px 144px 0 0 #8B5A2B, 192px 144px 0 0 #6b3a1f;
        }

        .contenedor-oscuro {
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 12px;
            max-width: fit-content;
            margin: 20px auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .content-section h3 {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            margin: 0 0 5px 0;
        }

        .content-section h2 {
            color: #ffffff;
            font-size: 1.5rem;
            margin: 0 0 20px 0;
        }
    </style>
</head>

<body>

    <div class="contenedor-oscuro">
        <main class="content-section">
            <h3>CSS</h3>
            <h2>28-challenge-shadow</h2>
            <figure class="frame">
                <div class="squares"> </div>
                <div class="saitama"> </div>
            </figure>
        </main>
    </div>


</body>

</html>
