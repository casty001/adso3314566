<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36-transitions</title>
    <link rel="stylesheet" href="../src/css/03-css.css">
    <style>
        main section {
            img {
                border: none;
                border-radius: 0;
                filter: drop-shadow(0 0 12px #fff)
            }

            img.transition01 {
                transition: transform 0.5s ease-in;
                &:hover{
                    transform: scale(1.3);
                }
            }
            img.transition02 {
                transition: transform 0.5s ease-out;
                &:hover{
                    transform: rotate(-0.5turn);
                }
            }
            img.transition03 {
                transition: transform 0.5s ease-in-out;
                &:hover{
                    transform: rotateY(180deg);
                }
            }
            img.transition04 {
                transition: transform 0.5s linear;
                &:hover{
                    transform: translateX(80px);
                }
            }
            div.box{
                background-color: #fff;
                height: 80px;
                margin-block: 2rem;
                width: 80px;
                transition: width 1s, height 1s 1s, background-color 2s 1s;

                &:hover{
                    background-color: red;
                    width: 300px;
                    height: 160px;
                }
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1>36-transitions</h1>
            <h2>enable you to define the transition beetween two states of an element</h2>
        </header>
        <section>
            <h3>scale(1.4):</h3>
            <img class="transition01" src="../src/imgs/dk.png" alt="">
            <h3>Rotate(-180deg):</h3>
            <img class="transition02" src="../src/imgs/dk.png" alt="">
            <h3>TranslateX(-180deg):</h3>
            <img class="transition03" src="../src/imgs/dk.png" alt="">
            <h3>TranslateX(100px):</h3>
            <img class="transition04" src="../src/imgs/dk.png" alt="">
            <h3>Multiple:</h3>
            <div class="box" alt="">
        </section>
    </main>

</body>

</html>
