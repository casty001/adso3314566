<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37-animations</title>
    <link rel="stylesheet" href="../src/css/03-css.css">
    <style>
        main section {
            div.jungle {
                background: url(../src/imgs/jungle.png) no-repeat center;
                border-radius: 4px;
                margin-block: 2rem;
                position: relative;
                height: 471px;
                width: 380px;

                img {
                    border-radius: 0;
                    border: none;
                    position: absolute;
                }

                img.logo {
                    top: 35px;
                    left: 30px;
                    height: 72px;
                    object-fit: contain;
                    width: 317px;
                    animation: 1s animLogo ease-in infinite;
                }

                img.dk {
                    top: 120px;
                    left: 90px;
                    width: 140px;
                    object-fit: contain;
                    z-index: 8;
                    animation: animDK 2s ease-in-out infinite;
                }

                div.move {
                    position: absolute;
                    top: 305px;
                    left: 0;

                    img.ryno {
                        width: 140px;
                        object-fit: contain;
                        animation: animRino 0.5s ease-in-out infinite; 
                    }
                }
            }
        }

        @keyframes animLogo {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        @keyframes animDK {
            0% {
                top: 130px;
                transform: rotateX(0deg);
            }

            40% {
                top: 80px;
                transform: rotateX(0deg);
            }

            50% {
                top: 80px;
                transform: rotateX(360deg);
            }

            60% {
                top: 80px;
                transform: rotateX(360deg);
            }

            100% {
                top: 130px;
                transform: rotateX(360deg);
            }

        }
        @keyframes animRino{
            0%,100%{top:0px;}
            50%{top:-8px;}
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h2>37-animations</h2>
            <h2>lest an element</h2>
        </header>
        <section>
            <div class="jungle">
                <img class="logo" src="../src/imgs/logo-dk.png" alt="">
                <img class="dk"src="../src/imgs/dk.png" alt="">
                <div class="move">
                    <img src="../src/imgs/ryno.png" class="ryno"alt="">
                </div>
            </div>
        </section>
    </main>
</body>

</html>
