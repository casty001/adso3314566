<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>38-media-queries</title>
    <link rel="stylesheet" href="../src/css/03-css.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');
        body {
            font-family: Poppins;
            background: #1a1a2e;
            min-height: 100vh;
            padding: 2rem;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            background: #16213e;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        h1 {
            color: #fff;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        h2 {
            color: #aaa;
            text-align: center;
            font-weight: normal;
            margin-bottom: 2rem;
        }
        .contenedor {
            display: grid;
            gap: 1.5rem;
            padding: 1rem;
        }

        .personaje {
            background: #0f3460;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .personaje:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .personaje img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .personaje .caption {
            padding: 1rem;
            color: #fff;
            text-align: center;
            background: rgba(15, 52, 96, 0.9);
        }

        .personaje .caption h3 {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
            color: #e94560;
        }

        .personaje .caption p {
            font-size: 0.9rem;
            color: #ccc;
        }

        @media screen and (min-width: 1024px) {
            .contenedor {
                grid-template-columns: repeat(4, 1fr);
            }

            .personaje img {
                height: 250px;
            }

            h1 {
                font-size: 3rem;
            }
        }
        @media screen and (min-width: 768px) and (max-width: 1023px) {
            .contenedor {
                grid-template-columns: repeat(2, 1fr);
            }

            .personaje img {
                height: 220px;
            }

            main {
                padding: 1.5rem;
            }

            h1 {
                font-size: 2.2rem;
            }
        }
        @media screen and (max-width: 767px) {
            .contenedor {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .personaje img {
                height: 200px;
            }

            main {
                padding: 1rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            h2 {
                font-size: 1rem;
            }

            .personaje .caption h3 {
                font-size: 1rem;
            }
        }
        @media screen and (max-width: 480px) {
            body {
                padding: 0.5rem;
            }

            main {
                padding: 0.5rem;
                border-radius: 8px;
            }

            .contenedor {
                gap: 0.8rem;
            }

            .personaje img {
                height: 150px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .personaje .caption {
                padding: 0.6rem;
            }

            .personaje .caption h3 {
                font-size: 0.9rem;
            }

            .personaje .caption p {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="hero">
            <div class="hero-content">
                <img src="../src/imgs/dinorey_logo.png">
            </div>
        </div>
        
        <div class="contenedor">
            <div class="personaje">
                <img src="../src/imgs/zoe.webp">
                <div class="caption">
                    <h3>Zoe</h3>
                    <p>Personaje 1</p>
                </div>
            </div>
            <div class="personaje">
                <img src="../src/imgs/rex.jpeg">
                <div class="caption">
                    <h3>Rex</h3>
                    <p>personaje 2</p>
                </div>
            </div>
            <div class="personaje">
                <img src="../src/imgs/max.webp">
                <div class="caption">
                    <h3>Max</h3>
                    <p>personaje 3</p>
                </div>
            </div>
            <div class="personaje">
                <img src="../src/imgs/Dr.Spike_taylor.webp" >
                <div class="caption">
                    <h3>Dr.Spike</h3>
                    <p>personaje 4</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
