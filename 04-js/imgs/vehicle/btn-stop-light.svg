<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Gradiente para el fondo del botón -->
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gradiente para el icono de Stop -->
    <linearGradient id="stopIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Sombras y resplandor -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    .button {
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    .button:hover .bg {
      stroke: #f87171;
      stroke-width: 2px;
    }
    .button:hover .square {
      transform: scale(1.08);
      transform-origin: center;
    }
    .button:active {
      transform: scale(0.96);
      transform-origin: center;
    }
    .text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 15px;
      fill: #f8fafc;
      letter-spacing: 0.5px;
    }
  </style>

  <g class="button" filter="url(#glow)">
    <!-- Base del Botón -->
    <rect class="bg" x="10" y="10" width="140" height="140" rx="28" fill="url(#btnBg)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Icono de Stop (Cuadrado Relleno con Bordes Suaves) -->
    <rect class="square" x="58" y="46" width="44" height="44" rx="8" fill="url(#stopIcon)" />
    
    <!-- Etiqueta de Texto -->
    <text x="80" y="118" class="text" text-anchor="middle">DETENER</text>
  </g>
</svg>
