<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Gradiente de fondo ultra limpio -->
    <linearGradient id="btnLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Gradiente Neón para el borde e icono -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Sombra suave elevada -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#64748b" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05"/>
    </filter>

    <!-- Resplandor Neón al pasar el cursor -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .btn-container {
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-border {
      transition: stroke 0.3s ease, filter 0.3s ease;
    }
    .stop-ring {
      transition: transform 0.3s ease, stroke 0.3s ease;
    }
    .stop-center {
      transition: transform 0.3s ease, fill 0.3s ease;
    }
    .btn-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #475569;
      letter-spacing: 1.5px;
      transition: fill 0.3s ease;
    }

    /* Efectos Hover */
    .btn-container:hover .btn-border {
      stroke: url(#neonGradient);
      filter: url(#neonGlow);
    }
    .btn-container:hover .stop-ring {
      transform: scale(1.05);
      transform-origin: 80px 65px;
    }
    .btn-container:hover .stop-center {
      fill: #06b6d4;
      transform: scale(0.9);
      transform-origin: 80px 65px;
    }
    .btn-container:hover .btn-text {
      fill: #0f172a;
    }
    .btn-container:active {
      transform: scale(0.95);
      transform-origin: center;
    }
  </style>

  <g class="btn-container">
    <!-- Cuerpo Principal -->
    <rect x="12" y="12" width="136" height="136" rx="36" fill="url(#btnLight)" filter="url(#softShadow)" />
    
    <!-- Borde con acento -->
    <rect class="btn-border" x="12" y="12" width="136" height="136" rx="36" fill="none" stroke="#e2e8f0" stroke-width="2" />

    <!-- Icono Stop: Anillo con centro independiente -->
    <rect class="stop-ring" x="59" y="44" width="42" height="42" rx="10" fill="none" stroke="url(#neonGradient)" stroke-width="3" />
    <rect class="stop-center" x="69" y="54" width="22" height="22" rx="4" fill="url(#neonGradient)" />

    <!-- Etiqueta -->
    <text x="80" y="118" class="btn-text" text-anchor="middle">PARAR</text>
  </g>
</svg>
