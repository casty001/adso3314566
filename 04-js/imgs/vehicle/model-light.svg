<svg xmlns="http://www.w3.org/2000/svg" width="180" height="160" viewBox="0 0 180 160">
  <!-- Fondo blanco con bordes redondeados y borde sutil -->
  <rect x="8" y="8" width="164" height="144" rx="20" ry="20" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2" />

  <!-- Icono de Calendario (Verde Lima / Neón) -->
  <g stroke="#84cc16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Cuerpo del calendario -->
    <rect x="50" y="42" width="80" height="60" rx="8" ry="8" />
    
    <!-- Línea superior del calendario -->
    <line x1="50" y1="58" x2="130" y2="58" />
    
    <!-- Anillos/Ganchos superiores -->
    <line x1="68" y1="36" x2="68" y2="44" />
    <line x1="112" y1="36" x2="112" y2="44" />
    
    <!-- Puntos de días -->
    <circle cx="80" cy="72" r="1.5" fill="#84cc16" />
    <circle cx="98" cy="72" r="1.5" fill="#84cc16" />
    <circle cx="68" cy="84" r="1.5" fill="#84cc16" />
    <circle cx="86" cy="84" r="1.5" fill="#84cc16" />
    <circle cx="104" cy="84" r="1.5" fill="#84cc16" />
  </g>

  <!-- Texto "Model" -->
  <text x="90" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#9ca3af" text-anchor="middle">Model</text>
</svg>
