<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Gradiente de fondo claro y cálido -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Gradiente de acento Verde Menta Suave -->
    <linearGradient id="mintAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Sombras Neumórficas Suaves -->
    <filter id="softNeumorphism" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#64748b" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.03" />
    </filter>

    <!-- Resplandor Menta para el Hover -->
    <filter id="mintGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .light-btn {
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-card {
      transition: stroke 0.3s ease, filter 0.3s ease;
    }
    .power-icon-group {
      transition: transform 0.3s ease, filter 0.3s ease;
      transform-origin: 80px 58px;
    }
    .status-badge {
      transition: fill 0.3s ease, transform 0.3s ease;
    }

    /* Hover and Active States */
    .light-btn:hover .btn-card {
      stroke: #10b981;
      stroke-width: 2px;
    }
    .light-btn:hover .power-icon-group {
      transform: scale(1.1);
      filter: url(#mintGlow);
    }
    .light-btn:hover .status-badge {
      fill: #10b981;
    }
    .light-btn:active {
      transform: scale(0.96);
      transform-origin: center;
    }

    .btn-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #334155;
      letter-spacing: 2px;
    }
    .status-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 9px;
      fill: #059669;
      letter-spacing: 0.5px;
    }
  </style>

  <g class="light-btn">
    <!-- Tarjeta Base Clara -->
    <rect class="btn-card" x="12" y="12" width="136" height="136" rx="32" 
          fill="url(#lightBg)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softNeumorphism)" />

    <!-- Icono de Encendido (Menta / Verde ESMERALDA) -->
    <g class="power-icon-group">
      <path d="M 64 48 A 20 20 0 1 0 96 48" fill="none" stroke="url(#mintAccent)" stroke-width="4.5" stroke-linecap="round" />
      <line x1="80" y1="34" x2="80" y2="54" stroke="url(#mintAccent)" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- Indicador Pill con Estado Activo -->
    <rect class="status-badge" x="48" y="96" width="64" height="20" rx="10" fill="#ecfdf5" />
    <circle cx="58" cy="106" r="3" fill="#10b981" />
    <text x="82" y="109" class="status-text" text-anchor="middle">ACTIVE</text>
  </g>
</svg>
