<svg xmlns="http://www.w3.org/2000/svg" width="160" height="150" viewBox="0 0 160 150">
  <defs>
    <!-- Degradado suave para el fondo claro estilo Glassmorphism -->
    <linearGradient id="lightBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Sombras y gradiente para el icono en azul moderno -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Botón con bordes redondeados y sombra sutil -->
  <rect x="8" y="8" width="144" height="134" rx="22" ry="22" fill="url(#lightBgGrad)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Círculo contenedor sutil para la flecha -->
  <circle cx="80" cy="58" r="26" fill="#eff6ff" />

  <!-- Icono de Flecha Izquierda -->
  <g stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Línea principal -->
    <line x1="94" y1="58" x2="66" y2="58" />
    <!-- Cabeza de la flecha -->
    <polyline points="75,49 66,58 75,67" />
  </g>

  <!-- Texto "Prev" -->
  <text x="80" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1e293b" text-anchor="middle" letter-spacing="0.5">Prev</text>
</svg>
