<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Gradiente para el chasis metálico -->
    <linearGradient id="chassisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gradiente Verde Neón Hi-Tech -->
    <linearGradient id="techNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Resplandor Radial Intensificado -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .scifi-btn {
      cursor: pointer;
    }
    .hud-ring {
      transform-origin: 80px 60px;
      transition: transform 0.6s ease;
    }
    .power-symbol {
      transition: transform 0.3s ease, filter 0.3s ease;
      transform-origin: 80px 60px;
    }
    .frame-border {
      transition: stroke 0.3s ease;
    }

    /* Animación de pulso continuo para el anillo Sci-Fi */
    @keyframes pulseRing {
      0% { opacity: 0.4; }
      50% { opacity: 0.9; }
      100% { opacity: 0.4; }
    }

    .tech-dots {
      animation: pulseRing 2s infinite ease-in-out;
    }

    /* Hover State */
    .scifi-btn:hover .hud-ring {
      transform: rotate(90deg);
    }
    .scifi-btn:hover .power-symbol {
      transform: scale(1.1);
      filter: url(#intenseGlow);
    }
    .scifi-btn:hover .frame-border {
      stroke: #22c55e;
    }
    .scifi-btn:active {
      transform: scale(0.96);
      transform-origin: center;
    }

    .hud-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 800;
      font-size: 12px;
      fill: #22c55e;
      letter-spacing: 3px;
    }
  </style>

  <g class="scifi-btn" filter="url(#outerShadow)">
    <!-- Marco Principal Biselado (Octágono suavizado) -->
    <path class="frame-border" d="M 32 12 L 128 12 L 148 32 L 148 128 L 128 148 L 32 148 L 12 128 L 12 32 Z" 
          fill="url(#chassisBg)" stroke="#1e293b" stroke-width="2" />
    
    <!-- Esquinas Acorazadas del Botón -->
    <path d="M 12 38 L 12 32 L 32 12 L 38 12" fill="none" stroke="#22c55e" stroke-width="2.5" />
    <path d="M 148 122 L 148 128 L 128 148 L 122 148" fill="none" stroke="#22c55e" stroke-width="2.5" />

    <!-- Anillo Tecnológico Decorativo Interactivo -->
    <circle class="hud-ring tech-dots" cx="80" cy="60" r="28" 
            fill="none" stroke="url(#techNeon)" stroke-width="1.5" stroke-dasharray="4, 6" />

    <!-- Símbolo de Encendido Principal -->
    <g class="power-symbol">
      <path d="M 66 50 A 18 18 0 1 0 94 50" fill="none" stroke="url(#techNeon)" stroke-width="4" stroke-linecap="square" />
      <line x1="80" y1="38" x2="80" y2="58" stroke="url(#techNeon)" stroke-width="4" stroke-linecap="square" />
    </g>

    <!-- Barra de Separación e Interfaz Visual -->
    <line x1="30" y1="104" x2="130" y2="104" stroke="#1e293b" stroke-width="1" />
    <rect x="76" y="103" width="8" height="3" fill="#22c55e" />

    <!-- Etiqueta de Texto Tipo HUD -->
    <text x="82" y="125" class="hud-text" text-anchor="middle">[START]</text>
  </g>
</svg>
