<svg xmlns="http://www.w3.org/2000/svg" width="160" height="150" viewBox="0 0 160 150">
  <!-- Fondo claro con bordes redondeados y borde suave -->
  <rect x="8" y="8" width="144" height="134" rx="20" ry="20" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2" />

  <!-- Icono de Flecha Derecha -->
  <g stroke="#1f2937" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Línea principal -->
    <line x1="56" y1="58" x2="104" y2="58" />
    <!-- Cabeza de la flecha -->
    <polyline points="90,44 104,58 90,72" />
  </g>

  <!-- Texto "Next" -->
  <text x="80" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#1f2937" text-anchor="middle">Next</text>
</svg>
