<svg xmlns="http://www.w3.org/2000/svg" width="220" height="120" viewBox="0 0 220 120">
  <!-- Fondo con bordes redondeados (Modo Oscuro) -->
  <rect x="10" y="10" width="200" height="100" rx="20" ry="20" fill="#1e2227" stroke="#3a3f47" stroke-width="2" />

  <!-- Icono de Sol (Luz) -->
  <g stroke="#9da5b4" stroke-width="3.5" stroke-linecap="round" fill="none">
    <!-- Círculo Central -->
    <circle cx="58" cy="60" r="14" />
    
    <!-- Rayos del Sol -->
    <line x1="58" y1="36" x2="58" y2="30" />
    <line x1="58" y1="84" x2="58" y2="90" />
    <line x1="34" y1="60" x2="28" y2="60" />
    <line x1="82" y1="60" x2="88" y2="60" />
    <line x1="41" y1="43" x2="36" y2="38" />
    <line x1="75" y1="77" x2="80" y2="82" />
    <line x1="41" y1="77" x2="36" y2="82" />
    <line x1="75" y1="43" x2="80" y2="38" />
  </g>

  <!-- Texto "Mode" -->
  <text x="105" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#9da5b4">Mode</text>
</svg>
